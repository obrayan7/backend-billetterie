# Déploiement sur un serveur (VPS) :
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Étape unique avant le premier lancement complet (voir DEPLOIEMENT.md) : migrations puis données de base.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: tools, args: { APP: web } }
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: runner, args: { APP: web } }
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SITE_URL: https://${DOMAIN}
      ADMIN_URL: https://admin.${DOMAIN}
    depends_on:
      migrate: { condition: service_completed_successfully }

  admin:
    build: { context: ., target: runner, args: { APP: admin } }
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_URL: https://${DOMAIN}
      WEB_INTERNAL_URL: http://web:3000   # l'admin parle au site par le réseau Docker (l'API interne n'est pas exposée)
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, admin]

  # Nettoyage des commandes expirées, toutes les 5 minutes
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ['while true; do sleep 300; curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://web:3000/api/cron/expire || true; done']
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on: [web]

  # Sauvegarde quotidienne de la base (conservée 14 jours dans le volume « backups »)
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - backups:/backups
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
